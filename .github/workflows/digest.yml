name: Build digest

on:
  schedule:
    - cron: "0 11 * * *"   # checked daily; script only builds if >=46h since last run
  workflow_dispatch:        # manual "Run workflow" button (always builds)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build digest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          MODEL: google/gemini-2.5-flash-lite
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python digest.py
      - name: Commit results
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Update digest" && git push)
